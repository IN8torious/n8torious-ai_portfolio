  <ShortDescription>Selectable, reversible Capsule OS settings with an optional Toolbox companion.</ShortDescription>
  <Title>Capsule OS playbook</Title>
  <Description>Reversible Windows tweaks selected in the Capsule Toolbox and governed by SI Core.</Description>
  <Details>- Windows dark theme: Dark theme for apps and the system.
- Turn off transparency: Disable translucent window and taskbar effects.
- Turn off window animations: Disable minimize and maximize animations.
- Left-aligned taskbar: Windows 11: align taskbar icons to the left.
- Hide the Chat button: Windows 11: remove the Teams chat button from the taskbar.
- Hide the Task View button: Remove the Task View button from the taskbar.
- Compact File Explorer rows: Windows 11: reduce spacing in File Explorer lists.
- Turn off the advertising ID: Stop apps using a per-user advertising identifier.
- No tailored experiences: Do not use diagnostic data to personalise tips and ads.
- Keep web results out of Start search: Search only your PC from the Start menu.
- Turn off Windows Copilot: Disable the Copilot sidebar via the user policy.
- Turn off AI data analysis (Recall): Stop Windows saving snapshots of your activity for AI features.
- Turn off activity history: Stop Windows recording and syncing activity history.
- Minimum diagnostic data: Ask Windows to send only required diagnostic data (the lowest level your edition honours).
- No feedback prompts: Stop Windows asking for feedback.
- Turn off Windows Error Reporting: Do not send crash reports to Microsoft.
- No typing and inking collection: Stop collecting typing and handwriting samples.
- Deny location access by default: Block location for apps unless you allow it per app.
- Stop apps running in the background: Prevent Store apps from running while closed.
- No peer-to-peer update sharing: Download updates only from Microsoft, not other PCs.
- No auto-installed promoted apps: Stop Windows installing suggested apps and promotions.
- No Windows Spotlight extras: Remove Spotlight promotions and tips.
- No Start menu suggestions: Remove suggested apps and promotions from Start.
- No lock screen tips and ads: Remove tips, tricks and promotions from the lock screen.
- No suggestions in Settings: Remove suggested content from the Settings app.
- Turn off the Widgets feed: Disable the news and interests feed by policy.
- Turn off OneDrive file sync: Stop OneDrive syncing (the app stays installed).
- Turn off AutoPlay: Do not auto-open removable drives and discs.
- Show file extensions: Always show file extensions in names.
- Show hidden files: Show hidden files and folders.
- Open File Explorer to This PC: Start File Explorer at This PC instead of Home.
- No recent and frequent lists: Stop File Explorer listing recent files and frequent folders.
- Full path in the title bar: Show the whole folder path in File Explorer.
- Faster menus: Remove the delay before menus open.
- Faster app shutdown: Close hung apps sooner at sign-out and shutdown.
- No startup app delay: Launch startup apps immediately after sign-in.
- Visual effects for performance: Use the &quot;adjust for best performance&quot; visual effects preset.
- Prioritise foreground apps: Reserve less CPU for background multimedia tasks and lift network throttling.
- Turn off Game DVR capture: Stop background game recording overhead.
- Raw mouse input (no acceleration): Turn off pointer acceleration for 1:1 aiming.
- No Sticky Keys pop-ups: Stop the accessibility shortcut prompts interrupting games.
- Classic fullscreen behaviour: Disable fullscreen optimizations system-wide.
- Hardware-accelerated GPU scheduling: Let a supported GPU manage its own memory scheduling. Needs a restart.
- Turn off power throttling: Stop Windows throttling background apps to save power. Uses more battery.
- Turn off Remote Assistance: Do not allow inbound Remote Assistance requests.
- Turn off LLMNR: Disable a legacy name-resolution protocol used in spoofing attacks.
- Turn off AutoRun on all drives: Never run programs automatically from drives.
- Allow encrypted DNS (DoH): Let Windows use DNS over HTTPS with servers it knows support it.
- Stop smart multi-homed DNS queries: Do not send a lookup to every network adapter at once, which can leak names to the wrong network.
- Skip the internet connectivity probe: Stop contacting a Microsoft server to test the connection. The network icon may then show limited access.
- No automatic open-hotspot connections: Do not auto-connect to suggested open Wi-Fi hotspots.</Details>
